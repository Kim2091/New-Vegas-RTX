; fnv_remix_nvse.dll -- the engine monitor of the FNV Remix wrapper.
; Goes next to the DLL in Data\NVSE\Plugins. Missing keys keep these defaults.

[Monitor]
; Main-loop frames between two integrity re-checks of the monitored code sites
; (and two re-checks of the attached cells against the engine).
Period=300
; A world-camera move this far (units) within one frame, with no load running,
; counts as a cut (a console teleport, a scripted moveto).
CutDistance=2048
; An attached cell counts as loaded once xNVSE reports its references loaded,
; once its reference queue counters stay at zero for RefsLoadedPollFrames
; main-loop frames (a re-attached cell gets no xNVSE event), or after
; RefsLoadedTimeoutMs, whichever comes first.
RefsLoadedPollFrames=30
RefsLoadedTimeoutMs=20000

[Report]
; Changed .text ranges listed one per line in the startup report (all ranges
; are counted in the per-module summary either way).
TextDiffRanges=200

[Decals]
; Alpha-blended overlays (SrcAlpha / InvSrcAlpha, no alpha test) whose diffuse
; texture or STAT model path matches a rule get the engine's own decal flag
; (Decal_Single_Pass) on their shader property when their reference loads:
; the engine then draws them without z-write and with the decal depth bias,
; and Remix gets them as DECAL_STATIC. Never written to a property that some
; geometry fails the rule on, or that already carries a decal flag, or while
; the engine's decal code is patched by another module. Paths are
; case-insensitive, '*' and '?' wildcards, ';' between rules; texture paths
; start with textures\, model paths with meshes\.
Enabled=1
TexturePaths=textures\clutter\nvstain*;textures\decals\*;*\blood*decal*;*\dirtdecal*;*decal_d.dds
ModelPaths=meshes\clutter\decals\*
; Flat blended STAT / MSTT overlays that match no rule are logged (never
; written), this many per session, so the rules grow from evidence.
CandidateLogs=0

[GameFog]
; The game's own fog, mist and haze cards are hidden when their reference
; loads (the engine's app-culled flag on the geometry), so Remix's volumetrics
; are the only fog. Classified from the geometry's own render data, never from
; file names, so mods' fog is covered too. Hidden: geometry of a placed
; reference (any base form) that is unlit (NoLighting shader), alpha-blends
; SrcAlpha / InvSrcAlpha, has a UV-scrolling texture controller and is not a
; particle system. Additive glow (light shafts, neon, holograms), lit or
; static-UV surfaces and particle systems (fire, torch, chimney smoke,
; explosions, sparks) stay. 0 = the game's fog is drawn (read at game start).
Enabled=1
; The first hidden reference of each model is logged, this many models per
; session.
RemovedLogs=128
; Blended (not additive) geometry that misses exactly one signal is logged as
; a candidate (drawn), once per model and missing signal, this many lines per
; session.
CandidateLogs=0

[Logging]
; 1 = every line of fnv_remix_nvse.log, including the 600-frame [LightReg],
; [OwnerMap] and [Decal] status lines. 0 = a repeated kind of line is written
; for its first 10 lines, then at most once every 5 minutes with a count.
; The previous session's log is kept as fnv_remix_nvse.prev.log.
Verbose=0
