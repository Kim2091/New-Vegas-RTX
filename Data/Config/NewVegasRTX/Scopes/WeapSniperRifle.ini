; New Vegas RTX scope lens for WeapSniperRifle (Sniper Rifle).
; First-person weapon node space (the mesh's root), game units; Axis and Up give the directions.
; Measured by tools/make_presets.py from the scope glass in the game's own meshes:
;   Weapons\2HandRifle\SniperRifle.NIF
;   weapons\2handrifle\SniperRifleSuppressor.nif
;   weapons\2handrifle\sniperrifleCarbonFiber.nif
;   weapons\2handrifle\sniperrifleCarbonFiberSuppressor.nif
; Confidence: high.
; Zoom range: 0.5x to 1.5x of the vanilla magnification 3.46 (Magnification is left unset, so the plugin computes the same value).

