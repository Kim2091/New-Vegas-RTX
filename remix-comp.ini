; remix-comp configuration for Fallout: New Vegas
;
; ------------------------------------------------------------
; Editing live: Remix menu (Alt+X) > Host Settings tab
;
; Most settings below also appear in the Remix developer menu's "Host
; Settings" tab, grouped by the section they live in here ([Remix] and
; [Chain], and text values such as StaticsPsAllow / HeightSuffixes /
; ExtraArchives, are ini only). A change there is applied between frames and
; written back to THIS file right away: only the key's value changes, every
; comment and line stays where it is, and a key the file doesn't have yet is
; added after the last key of its section. Hover a control for its
; description and ini key.
;   * Most take effect on the next frame. StableOrigin and RetainedInstances
;     switch over cleanly: off destroys every retained instance and the
;     per-frame DrawInstance route takes over from the next frame; on starts
;     again with the next draws. StableOrigin off also turns
;     RetainedInstances off (it needs the origin).
;   * Every ray-traced draw goes through the Remix API (docs/fnv-api-only.md);
;     a traced draw no API path takes is not drawn. The "[RemixApi]
;     traced->D3D9" status line counts what skipped the API, by route and
;     reason (outside the Pip-Boy, d3d9= lists only the D3D9-only texture
;     lists).
;   * Settings used when an API mesh is built (roughness, water medium,
;     weight texture size, ...) apply to meshes built afterwards; the button
;     RemixApi > "Rebuild API meshes and textures" rebuilds everything now
;     (textures too, e.g. after switching ImportD3D9Textures).
;   * Settings marked "(restart)" are only saved; they apply at next launch.
; Needs a Remix bridge and runtime with the host-settings exports;
; otherwise the tab stays empty and rtx-remix\logs\remix-comp.log says why.
; ------------------------------------------------------------

; ============================================================
; Remix Bridge
;
; When Enabled=1, the d3d9.dll proxy loads the named DLL and
; forwards Direct3DCreate9/Ex through it. Enabled=0 bypasses Remix
; and forwards to the system d3d9.dll.
;
; DLLName should be the RTX Remix bridge d3d9.dll renamed so it
; doesn't collide with this proxy. Place it next to d3d9.dll in
; the game directory.
; ============================================================
[Remix]
Enabled=1
DLLName=d3d9_remix.dll

[Chain]
; Semicolon-separated list of DLLs/ASIs to load before the d3d9 chain is established.
; Example: Preload=dinput8.dll;some_other_mod.asi
Preload=

; Semicolon-separated list of DLLs/ASIs to load after the game window appears.
Postload=

; ============================================================
; Game settings
;
; At startup the game's own graphics settings that RTX Remix replaces
; are set in memory, right after the game reads Fallout.ini and
; FalloutPrefs.ini: shadow maps, HDR, multisampling, anisotropy, depth
; of field, radial blur and the water reflection / refraction passes go
; off, and a few distances are set. The INI files are not changed.
; While this is on, the launcher's graphics options for these settings
; have no effect. The list and each old -> new value are in
; rtx-remix\logs\remix-comp.log ([GameSettings]).
; ============================================================
[GameSettings]
; 1 = apply them (needed for the mod to look and run as intended).
; 0 = the game uses the values in its INI files.
Apply=1

; ============================================================
; FFP Conversion Settings
; ============================================================
[FFP]
Enabled=1
AlbedoStage=0
; Per-declaration-shape overrides: the texture stage (0-7) that holds the
; diffuse for that mesh class.
; TerrainAlbedoStage has no effect on FNV terrain: every terrain shader has a
; Diffuse role in the PS classifier (diff=s0), apply_ps_protocol rebinds slot 0
; to that slot after setup_albedo_texture, and land goes through the Remix API.
TerrainAlbedoStage=0
BIAlbedoStage=1

; Orthographic UI draws (HUD, menus, Pip-Boy cursor / highlight quads) keep the
; game's vertex shader. With rtx.useVertexCapture the runtime turns each one
; drawn before RTX injection into a small traced quad at the near plane of the
; last FFP projection -- a dark square floating at the player's eye that casts
; shadows on the Pip-Boy. 1 = tag them Hidden (still rasterised, never traced).
; An untextured one can't be tagged; [Diagnostics] ScreenSpaceLog reports it.
HideScreenSpaceDraws=1

; Skip the engine's untextured vertex-colour-only draws (baked fake-shadow
; quads). 0 = draw them.
SkipFakeShadows=1

; (The CPU vertex expanders -- flipbook particles, NOLIGHT UV transforms,
; instanced grass / distant objects / distant trees, SpeedTree leaves as
; world-up cards -- are always on: the Remix-API paths are built from their
; copies. rtx-remix\logs\remix-comp.log gets a "VSExpand: first use" line per family
; and a status line every 600 frames.)


; ============================================================
; Remix API geometry
;
; Every ray-traced draw goes through the Remix API: the geometry is built
; once as an API mesh (CreateTexture / CreateMaterial / CreateMesh, throttled
; by MaxBuildsPerFrame) and drawn with a retained instance or one DrawInstance
; per frame at the moment the game draws it; the game's own draw is skipped.
; A draw an API path can't handle (unreadable buffer, budget spent this frame,
; ...) is not drawn that frame (grass, leaves and unlit FX keep drawing their
; current copy). Two kinds of traced draw keep their D3D9 route: the
; Pip-Boy's own draws while it is open, and draws whose texture is in rtx.conf's
; rtx.lightConverter (bulbs, neon: the runtime makes their effect lights only
; on D3D9 draws), uiTextures, lightmapTextures or
; raytracedRenderTargetTextures. Needs a Remix runtime and bridge with the
; terrain-layers material extension and API texture lookup.
;
; rtx-remix\logs\remix-comp.log: one "first API submission OK" / "first API build
; FAILED (reason)" line per feature, and status lines every
; StatsIntervalFrames frames (live meshes, draws, dropped draws, texture
; uploads, material-protocol RS writes per frame, and "traced->D3D9" with
; every traced draw that skipped the API). The F4 overlay's FFP tab shows the
; land / far LOD / water numbers live.
; ============================================================
[RemixApi]
; Near land (the SLS2092-2147 multi-layer shaders): all of a quad's ground
; layers blended per ray hit by the runtime's TerrainLayersEXT material, with
; the per-vertex layer weights and vertex tint baked into small textures.
; Distant land LOD blocks (no-normal far LOD, PS 0x36E87D02) carry the
; engine's per-vertex loaded-area sink baked into the mesh; the near land LOD
; (PS 0x6626FACE) is not drawn. Water surfaces are translucent ANIMATED_WATER
; meshes (IoR, transmittance from the water type's shallow/deep colours,
; procedural ripple normal map), distant water (WATER034) too; the water
; point-light specular passes are dropped.

; Weight/tint texture edge length for land quads, in texels. 65 = 16*4+1 puts
; a texel centre on every land vertex and 3 between each pair, so bilinear
; sampling reproduces the game's per-triangle weight blend almost exactly.
TerrainWeightRes=65
; Land and far-LOD roughness (metallic is 0). FNV land has no specular.
TerrainRoughness=0.85
; Land normal maps carry gloss (inverted roughness) in alpha, the NVR / texture-
; pack convention: layers whose normal map has real alpha (DXT3/DXT5/A8R8G8B8,
; not 255 everywhere) get roughness = 1 - alpha, the rest keep TerrainRoughness.
; Needs rtx.fnvProtocol.normalAlphaMode = 1 (runtime default). 0 = ignore alpha.
; Also applies to the normal maps of statics.
TerrainNormalGloss=1
; Parallax on API land: each layer's texture-pack height map ("<layer>_p.dds",
; [TexturePacks] HeightMaps) rides in the terrain material and the runtime
; marches the weight-blended height field (a layer without one counts as flat).
; Depth = rtx.fnvProtocol.heightDisplaceIn (0 = off). Always the raymarch POM,
; whatever rtx.displacement.mode says. A quad built while one of its height
; maps was still loading is rebuilt once the lookup finishes. Live: land
; rebuilds when switched. 0 = no height on API land.
TerrainHeightMaps=1
FarLodRoughness=0.9
; Distant land LOD detail, as the game's far-LOD shader draws it: each
; block's own normal map and the LOD noise texture over its colour. 0 = the
; block's colour texture alone (smooth, blurry shading).
FarLodDetail=1
; A far-LOD block whose sink moved (player crossed a cell) is rebuilt at most
; once per this many frames; the old mesh keeps drawing until then.
FarLodRebuildFrames=30
; New API objects (materials, meshes) per frame across all features. A draw
; over budget is not drawn that frame and waits in a fair queue: the oldest
; waiters get the next frame's slots first, so nothing stays missing for long
; (the traced->D3D9 status line's "budget:" part counts waits over 30 frames).
; Meshes of up to 512 vertices have their own 64 per frame on top of this.
; Lower = smaller hitches when lots of land streams in at once.
MaxBuildsPerFrame=16
; Frames an API mesh may go undrawn (off-screen, unloaded cell) before it is
; destroyed. With RetainedKeepCulled, only for entries that are hidden or have
; no retained instance; visible ones kept while culled use
; RetainedKeepCulledFrames.
EvictFrames=900
; Frames an uploaded texture with no users is kept for reuse before it is
; destroyed. Re-uploading is the expensive part of a rebuild.
TextureEvictFrames=1800
; Hand game textures to Remix by reference instead of uploading their pixels:
; the bridge's remixapi_ImportD3D9Texture makes Remix sample the texture the
; game already created on the bridge's device, so nothing but a handle crosses
; the bridge, Remix keeps no second copy, and the per-frame upload budget does
; not apply (less streaming pop-in). Taken per texture: MANAGED DXT1/3/5 and
; A8R8G8B8/X8R8G8B8 textures (normal maps: DXT1, or real gloss in alpha); the
; rest, and any texture the import refuses, are uploaded. Needs a bridge and
; runtime with the export (and rtx.hostImport.enableD3D9TextureImport, on by
; default). The status line gains imports= / importFallbacks=. 0 = upload
; every texture.
ImportD3D9Textures=1
; Textures a plugin asks for in D3DPOOL_DEFAULT (NVTF's [DirectX]
; bUseDefaultPoolForTextures) stay in D3DPOOL_DEFAULT: the wrapper hashes
; each one from the copy the game fills it from (UpdateTexture) and hands it
; to Remix by reference, whatever ImportD3D9Textures says, so the bridge keeps
; no CPU copy of it in the game's 4 GB address space. Textures that can't go
; that way (formats the import doesn't take, autogen mips, no import in the
; bridge or runtime) are still created MANAGED. 0 = create every such texture
; MANAGED (more than 1 GB of address space on heavy texture lists). The
; [Memory] status line shows what the bridge's CPU copies cost. Ini only
; (restart).
KeepDefaultPoolTextures=1

; Water medium. The transmittance colour is the hue of the water type's
; deep (mostly) and shallow colours, scaled by WaterClarity (0..1, lower =
; murkier -- even the dominant channel absorbs); MeasurementDistance (world
; units, 256 = 3.7 m) is scaled by the colours' brightness, so dark water is
; murkier still.
WaterIor=1.33
WaterMeasurementDistance=256
WaterClarity=0.8
; Ripple normal-map tile size in world units (70 units ~ 1 m; 1120 = 16 m).
; 0 = the water shader's own TexScale (its NoiseMap tiling).
WaterTileSize=1120
; Procedural ripple normal map (FFT-synthesised random wave field, BC5 with a
; full mip chain, built once): edge in texels (power of two, max 1024) and
; slope strength.
WaterNormalRes=1024
WaterNormalStrength=1.0
; Push the runtime's animated-water options (rtx.translucentMaterial.
; animatedWater*) derived from the values below. The runtime takes a second
; sample of the normal map at WaterDetailScale times the UV scale (a larger,
; incommensurate swell layer, so the tiles never line up) and scrolls both.
;   WaterFlowSpeed        primary drift, world units/s (21 ~ 0.3 m/s)
;   WaterDetailScale      second layer's UV scale (0.31 ~ a 52 m tile)
;   WaterDetailFlowSpeed  second layer's drift, world units/s
;   WaterDetailLodBias    extra blur on the second layer's sample, in mips
WaterRuntimeOptions=1
WaterFlowSpeed=21
WaterDetailScale=0.31
WaterDetailFlowSpeed=35
WaterDetailLodBias=0
; Distant water (WATER034) is fed the worldspace's default water colours,
; near water its own water type's, so the two media differ at the hand-over.
; Blend distant water's colours toward the near water in view:
; 1 = one shared material (seamless), 0 = distant water keeps its own colours.
WaterLodNearBlend=1
; Drive the runtime's underwater look (rtx.underwater.*: dimmed sun, caustics,
; depth murk) from the engine: rtx.underwater.enable and surfaceHeight follow
; the water at the camera (so a lake bed seen from the shore gets it), and the
; camera medium (the near water's transmittance) is set while the engine says
; the camera is below the surface. Off in menus, loading screens and at cuts.
; Needs the engine monitor plugin. Logged as [Underwater]. 0 = never touched.
Underwater=1

; Stable render origin. FNV renders camera-relative, so every transform Remix
; sees changes whenever the camera moves. On: Remix gets a world frame anchored
; at the camera's position snapped to a StableOriginGrid grid (world units),
; re-snapped once the camera is more than StableOriginRadius units from it
; (at least one grid cell). Rasterised output is unchanged (WORLD*VIEW is kept
; exactly); FFP lights and API draws move with the frame. Logged as
; [StableOrigin] each time the origin moves. 0 = camera-relative.
StableOrigin=1
StableOriginGrid=4096
StableOriginRadius=8192
; Publish the stable origin to the runtime (remixapi_SetGameValue
; __mcrtx.world_origin.x/y/z, world units, sent before the frame's first draw
; whenever it changes and again after a device reset), so render position +
; origin = world position. Needs StableOrigin=1 and, in rtx.conf,
; rtx.worldOrigin.enable = True. Keeps the NuMOS clouds and their ground
; shadows fixed in the world (without it they follow the player) and makes an
; origin re-snap neither motion nor a camera cut. Logged as [StableOrigin]
; "published world origin". 0 = not sent (an earlier one is reset to zero).
PublishWorldOrigin=1
; Render units per FNV world unit. Every world-space value the wrapper hands
; Remix (transforms, camera, lights, the origin, water heights and distances)
; is multiplied by it, so Remix and its captures work in centimetres
; (1.428571: 70 FNV units = 1 m) instead of FNV units. Rasterised output is
; unchanged. The world-unit options in rtx.conf (rtx.sceneScale,
; rtx.mergedBucketCellSize, rtx.uniqueObjectDistance, ...) are in render units
; and are tuned for 1.428571; set 1 only together with an rtx.conf in FNV
; units. Read at startup. The other distances in this file stay in FNV units.
WorldUnitScale=1.428571
; Hand Remix the game's world camera once per frame (remixapi_SetupCamera with
; the FALLBACK frame event), at the frame's first world draw: the renderer's
; VIEW (stable origin applied) and PROJECTION, as that draw gives them to D3D9.
; Remix uses it only on a frame where no D3D9 draw set its main camera -- where
; the world all went through the API (interior room culling), which otherwise
; shows a flat colour under the HUD with path tracing skipped. A D3D9 world
; draw's camera always wins. Needs a bridge that forwards SetupCamera (logged
; once as missing otherwise). 0 = not sent.
FallbackCamera=1
; Retained instances: land, far LOD and water meshes are registered once with
; the runtime and replayed every frame; per frame only real changes (a moved
; transform, visibility of what the game did or didn't draw) cross the bridge,
; in one batched call, followed by one DrawRetainedInstances. Needs
; StableOrigin=1 and a Remix bridge that forwards the retained-instance calls;
; otherwise (and for any draw it can't take) DrawInstance per frame. The status
; line gains retained= / retainedUpdates= / retainedFallback= per feature.
RetainedInstances=1
; When the frame's DrawRetainedInstances(O) is issued. 1 = at the frame's first
; BeginScene, right after the stable origin is computed for the frame: before
; the first HUD draw, which is what makes Remix trace the frame (the UI boundary),
; so the replay lands in this frame's trace with this frame's origin. The
; frame's hide / move updates still go out at Present (they are applied by the
; next frame's replay); a frame that never calls BeginScene replays at Present
; instead, and a frame never replays twice. 0 = at Present, after the trace:
; then rtx.retained.replayAtInjection = True is needed, which replays one
; frame late with the previous frame's origin. With 1 that runtime option is
; not needed (leaving it on is harmless: it only acts on a replay that arrives
; after the injection).
RetainedReplayAtFrameStart=1
; Culling is not visibility. 1 = a retained land / far
; LOD / water / static entry the game didn't draw this frame (behind the
; camera, occluded, beyond fade distance) stays in the ray-traced scene, so it
; keeps casting shadows and showing in reflections, and a camera turn changes
; nothing. It leaves the scene only when the engine really removed it:
;   * land, near water, statics: its centre leaves the loaded cell grid, the
;     interior changes, or the camera jumps (load, door, fast travel);
;   * statics: also its NiGeometry is destroyed (item picked up, reference
;     disabled; the scene-graph ~NiGeometry hook is installed for this), or
;     it is drawn somewhere else;
;   * far LOD, distant water: as RetainedLodRule says (below).
; A hidden entry is destroyed after EvictFrames undrawn; a visible
; one kept while culled after RetainedKeepCulledFrames (36000 = 10 min at
; 60 fps). Over RetainedKeepCulledCap entries in one feature, EvictFrames
; applies to all of them (memory guard, logged once). The status line gains
; keepCulled: counts. 0 = hidden the first frame it isn't drawn.
; With this on and verified, rtx.retainedHiddenPolicy = 1 becomes safe.
RetainedKeepCulled=1
RetainedKeepCulledFrames=36000
RetainedKeepCulledCap=8192
; What hides a far-LOD / distant-water block the game didn't draw.
;   1 = engine (default): only what the engine did to the block's NiGeometry
;       (learnt from the render-pass dispatcher when the block is drawn): it
;       was destroyed (~NiGeometry), drawn again as another entry (re-keyed:
;       new buffer, texture or look), or an app-culled node or a detach sits on
;       its parent chain. A block culled or occluded in view stays. Needs the
;       scene-graph hooks (installed on first use); a block whose NiGeometry is
;       unknown keeps rule 0.
;   0 = view: hidden once it has been in view (3-degree guard) and not drawn
;       for RetainedLodStaleFrames; off screen the last verdict is held (the
;       first keep-culled rule).
; Status line: lodRule=engine hidden[dead rekeyed appCulled detached]
; kept[linked unlinked inViewNotDrawn].
RetainedLodRule=1
; Rule 0 only: frames in view and not drawn before a block hides.
RetainedLodStaleFrames=10

; Draw capture (src/comp/game/api_statics.cpp): every traced world draw no
; dedicated path takes (what the scene-graph statics below refuse, have not
; claimed yet or never see: actor rigid parts, effects, blended or dynamic
; objects; BLENDINDICES / land-shaped / non-indexed / no-NORMAL world draws;
; the first-person weapon) becomes a cached API mesh (keyed by the
; draw's buffers, window, contents and material) drawn with one DrawInstance
; per frame at the draw's WORLD. The first pass of an object per frame is its
; instance; its later passes (raster light / multiply passes) are dropped.
; Opaque cutouts ride in the material, plain alpha blending and any other
; blend / alpha test on the instance; normals are computed when the draw has
; none. rtx.conf texture lists become instance categories (ignoreTextures ->
; IGNORE, particleTextures -> PARTICLE, decal lists -> DECAL_*, ...);
; uiTextures / lightConverter / lightmapTextures / raytracedRenderTargetTextures
; have no API form and keep the D3D9 route. Status line "capture:" (sent, first-person,
; passes dropped, refused per reason, meshes, materials).
; Pixel-shader hashes (0xXXXXXXXX as PSReflect logs them, comma-separated)
; the scene-graph statics may take (empty = every eligible shader) and
; must never take (those go through draw capture).
StaticsPsAllow=
StaticsPsDeny=
; StaticsDebugPlainMaterial=1 gives new static meshes (scene graph and draw
; capture) an albedo-only material (no terrain-layer normal / gloss, height,
; glow, cutout or vertex colour): statics that come back with it point at the
; material.
StaticsDebugPlainMaterial=0

; Skinned actors: NPC and
; creature bodies, armour, first-person arms and FaceGen heads. Each skinned
; partition becomes a cached API mesh (built once from its vertex buffer, in
; bind space, with blend weights and palette indices; a buffer the engine
; rewrites, such as a talking head or hair, is refreshed in place), drawn every
; frame with DrawInstance and the bone palette the engine just uploaded.
; Lighting-only passes and extra passes of a drawn object are dropped. Needs
; [Skinning] Enabled=1 (the bone capture) and a bridge with the skinning size
; fix. A bridge without it crashes on a skinned mesh, so the wrapper checks the
; bridge client and draws no skinned actor (bridgeFix=NO, refused bridge=)
; without it.
; Status line "skinned:": instances= (DrawInstance calls last frame),
; suppressed= (D3D9 draws skipped), folded= / extraSkipped= (extra passes),
; meshes=, materials=, bones/instance max= / avg=, firstPerson=, heads= (and
; how many head draws were refused, morph refreshes), blended= (actors
; fading), and refused= with a count per reason.

; Grass, SpeedTree leaves and the instanced distant objects / trees. The
; vertex expander turns each grass batch (GRASS20xx), leaf draw (STLEAF) and
; distant object / tree batch (DISTLOD / DISTTREE) into a static copy
; (instance positions baked in, wind dropped, leaves as world-up cards),
; built once as an API mesh with
; a retained instance (RetainedInstances=1, StableOrigin=1; otherwise, and
; while the camera settles after a jump, a DrawInstance per draw). A grass
; batch is identified by its own NiGeometry (the render-pass dispatcher's;
; a grass draw without one is not drawn: unlinked=), rebuilt only when its
; instance set changes, at most 6 grass builds a frame; a batch over budget or
; churning keeps drawing its current copy. The frame a retained instance is
; created it is also drawn with that frame's DrawInstance.
; Status line "foliage:": meshes= / instances=, visible=, linked=, last frame:
; taken=, firstFrame=, transient=, stale= (held / over-budget batches drawing
; their current copy), folded=, culled=, built=, grassDraws linked= /
; unlinked=, refused= per reason; grass batches= / generations= / held=; since
; the last line: rebuilds=, budgetHolds=, genChanges= / genHidden=, destroyed=
; / deaths=, culledHidden=, superseded=, refusedHidden=, leafMoved=,
; leafDeaths=; hooks dispatcher= batch=; instanced= (batches drawn as one
; model copy + its instances; "updated in place" = a batch that kept its mesh
; and took a new instance set) / baked= with the reason a batch was baked.
; A grass / distant object / distant tree batch is one copy of its model,
; GPU-instanced at each instance, so the model has a stable asset key and a
; mesh replacement of it applies to every instance. A batch whose copies
; differ, or a bridge client that doesn't forward
; InstanceInfoGpuInstancingEXT (logged at startup), keeps its instances baked
; into one mesh.

; Unlit FX, particles, first person, coloured glow (live in Host Settings
; "RemixApi: FX & first person").
; The NOLIGHT UV-transform FX become cached API meshes (UV transform baked into
; the texcoords, MaterialColor into the vertex colours), retained once they
; stay put, DrawInstance while new, moving or animated (animated UVs refresh
; the mesh in place). UnlitEmissiveIntensity: the texture is also its own glow
; at this intensity (0 = lit, no glow; additive draws get none).
; UnlitDebugLog: one "[RemixApi] unlit draw" line per distinct draw (texture,
; UV transform, vertex colour, MaterialColor, blend, decision).
; NOLIGHT017/019 flipbook particles: one capacity mesh per particle system,
; refreshed every frame under one hash (PARTICLE, the draw's blend).
; The first-person weapon goes through draw capture, never throttled.
; ViewModelCamera: first-person API draws carry VIEW_MODEL and the zoomed
; projection goes to the runtime as its VIEW_MODEL camera (rtx.viewModel.enable
; decides whether the runtime perspective-corrects them).
; ApiGlowTint: coloured EmittanceColor glow (and unlit MaterialColor) tints ride
; on API materials; pushes rtx.fnvProtocol.apiGlowTint=True (needs a runtime
; with that option).
; 0 = coloured glow is dropped.
; Status lines: "[RemixApi] unlit:", "particles:" with per-frame sent /
; refused counts and the refusal reasons.
UnlitEmissiveIntensity=1.0
UnlitDebugLog=0
ViewModelCamera=1
ApiGlowTint=1

; ShaderBakeHair: hair, beards and brows take their albedo from the game's own
; hair shader, run on the CPU with its lighting taken out (lights 0, ambient
; 1), instead of the LayerMap blend. The vertex colours and the material tint
; still carry the HairTint factor, and [Hair] Brightness still applies.
; A background thread bakes each hair texture pair once (shared by every NPC
; that wears it); until its bake is uploaded the hair keeps the LayerMap blend,
; then switches. A shader whose output isn't plain albedo (emissive residue,
; not linear in the ambient light, a vertex colour that isn't the HairTint
; factor) is refused: one "[HairBake] ... no baked albedo (reason)" line per
; shader and reason, and that hair keeps the LayerMap blend. Each bake logs a
; "[HairBake] ... baked" line; the status line "[RemixApi] hair bake:" counts
; bakes, uploads and the time spent on each thread. Hair textures loaded while
; this is on keep a CPU copy (needed when another mod creates textures in
; D3DPOOL_DEFAULT). Live in Host Settings.
ShaderBakeHair=1

; Scene graph. SceneGraphStatics=1: rigid statics are in the ray-traced
; scene while they are in the loaded scene graph, whether or not the engine
; draws them (frustum, portal / room and fade culling never remove them).
; Membership: the engine monitor plugin walks every reference's 3D when the
; engine sets or attaches it (and every reference of a cell that attaches)
; and hands each geometry of a non-actor reference to the wrapper (its member
; feed). Each member is seeded once, under SceneWalkBudgetUs per frame:
; classified (NiTriShape / NiTriStrips, no skin, BSShaderPPLightingProperty,
; not water / land / effect-blended), placed (its reference in an attached
; cell, base form type in SceneBaseTypes, not under a tree / billboard node)
; and recorded from the scene graph alone: the mesh from its packed D3D9
; buffers (NiGeometryData+0x34) and their declaration, the material from its
; properties (PPL diffuse / normal, NiMaterialProperty gloss, NiAlphaProperty
; test, NiStencilProperty two-sided, the engine clamp mode, the texture pack's
; height map). That claim is provisional: the first time the engine draws it,
; its base pass reaches the renderer once and its record replaces the seed's
; if any field differs (the "scene members" line counts which). Members held
; back (app-culled / disabled, no attached cell yet, not packed yet, diffuse
; not created yet, build budget, under a switch / LOD node showing another
; child) are looked at again; land-shaped ones are left to their draws. A
; geometry the engine draws before its seed is claimed from that draw (the
; render-pass dispatcher 0xB994F0) as before.
; SceneWalkBudgetUs: time the seed pass may take per frame (microseconds).
SceneWalkBudgetUs=400
; Every claim becomes one retained instance, kept in
; the scene while culled (shadows, reflections behind the camera), and from
; the next frame its render passes are skipped in the engine, but only while
; the retained path can draw that frame and the instance is visible; otherwise
; the pass reaches draw capture. Lifetime is the engine's: ~NiGeometry and
; the cell leaving the loaded grid destroy (one batched destroy per frame).
; Hides come from engine data only: an app-culled node in the reference's 3D
; or above it (cell nodes), a detached chain, the reference disabled / deleted
; or given another 3D, a switch / LOD ancestor showing another child
; (NiSwitchNode+0xB0); shown again the frame the engine draws it. Movers: the pose seen at a pass is compared
; bitwise; a move past 0.01 units goes out as one batched transform update.
; Reads between frames run under the resolve / destroy handshake (a
; ~NiGeometry on a loader thread waits for them). Anything not taken goes
; through draw capture. Needs RetainedInstances=1 and StableOrigin=1.
; Status line "scene:" (StatsIntervalFrames): discovered (new candidates;
; candidates, waiting for a base pass), claimed (created, failed), instances
; (hidden, switch leaves), meshes (built, shared), mats, suppressed passes
; (render passes skipped in the engine = draws saved), notReady (passes of
; claimed geometry sent to draw capture because the retained path couldn't
; draw that frame), destroyed dtor / cell / other, moved, hidden, shown, polled,
; deferred, stale, refused[reason=n] (class, terrain, skinned, water, shader,
; blend, blendTest, blendFx, lod, drawShader, denied, vs, layout, alphaFunc, glowTint, protocol,
; rtxconf, rtxHash, streamed, subtree, noAnchor, noRef, actor, baseType, buffer, build,
; nodata), cells, refRoots, listUs, uploadKiB, bufferMismatch, windowMismatch,
; handshake waits / timeouts / skippedDead, faults. "[SceneStatics] cells
; +a -b" lines log each wave of creates / destroys.
; Status line "scene members:": the geometries of loaded references (the
; member feed) against what is traced: traced (provisional, hidden by the
; game), waiting[...] (unseeded, queued, hidden, place, unpacked, texture,
; budget), engine draws decide[switch, landShape], refused[reason], the seed
; pass (seeds, records, held by reason, swept), what the first base pass of a
; provisional claim found (confirmed, replaced with the fields that differed,
; refused, unconfirmed), and claims from draws of geometry outside the
; membership.
; SceneBaseTypes: base form types (hex, comma-separated) whose references may
; be taken; empty = 20,21,15,16,17,1B,1C,1E,22,26,27 (STAT, SCOL, ACTI, TACT,
; TERM, CONT, DOOR, LIGH, MSTT, FLOR, FURN) and the loose items 18,19,1A,1D,1F,
; 28,29,2E,2F,31 (ARMO, BOOK, CLOT, INGR, MISC, WEAP, AMMO, KEYM, ALCH, NOTE;
; Havok moves them: the mover path follows). Geometry an actor owns (weapons,
; hats, hair) is never taken; draw capture draws it. Read at startup only.
; SceneClaimAlphaBlend: alpha-blended statics (NiAlphaProperty blend bit):
; 0 = none (draw capture), 1 = blend + alpha test (foliage cards, fences,
; grates, decal edges), 2 = also blend without a test (glass, plain decals).
; Blend + test goes out as a cutout (the test on the material, no blend);
; blend without a test keeps the draw's own alpha state on the instance
; (InstanceInfoBlendEXT; the material uses the draw-call alpha state). Only
; SrcAlpha / InvSrcAlpha; additive / effect blends go through draw capture.
; SceneDecalCategory=1: decals get DECAL_STATIC (DECAL_DYNAMIC for the dynamic
; decal flag or a moving draw) on every path (scene statics, draw capture,
; unlit) from the shader property's decal flags (flags1 bits 26 / 27, flags2 bit 21
; alpha decal; any BSShaderProperty class). The NVSE plugin sets bit 26 at load
; on the blended overlays its [Decals] rules name (fnv_remix_nvse.ini).
; [Decal] log lines name the rule.
; (rtx.conf texture lists become instance categories, as for draw capture.)
; SceneGlowGreyTint=1: a grey EmittanceColor on a glow map scales the emissive
; intensity (black = no glow); coloured tints ride on the material (ApiGlowTint).
; SceneLandShapeStatics=1: a colour + two-texcoord draw of a placed object
; whose PS is not a land shader is a static, not "terrain".
; SceneStreamedRelaxed=1: a buffer locked with DISCARD / NOOVERWRITE is still
; taken when it is not DYNAMIC (D3D9 ignores both flags on other buffers), was
; not written again within 300 frames and has been left alone for 30 frames; a
; later write gives its statics to draw capture at once. 0 = strict: any such
; lock refuses the buffer for its life (streamed.sticky).
; SceneDebugRefusalReport=N: once per session (and after a change) log the top
; N refused geometries per reason ([SceneStatics] refused ...). 0 = off.
; All Live in Host Settings; a change to the first six re-classifies every
; static. The "scene refused, per frame" line gives each refusal reason's
; render passes / FFP_WORLD draws per frame; "by[...]" on the scene: line
; splits claimed geometry by what it carries.
; SceneUploadKiBPerFrame: new mesh bytes per frame (with MaxBuildsPerFrame).
; Debug: SceneDebugDrawInstance=1 draws every visible scene instance with a
; DrawInstance per frame (at the frame's first render pass) instead of
; retained instances; SceneDebugDump=N logs the first N instances.
; All Live in Host Settings except SceneBaseTypes.
SceneGraphStatics=1
SceneBaseTypes=
SceneClaimAlphaBlend=2
SceneDecalCategory=1
SceneGlowGreyTint=1
SceneLandShapeStatics=1
SceneStreamedRelaxed=1
SceneDebugRefusalReport=5
SceneUploadKiBPerFrame=4096
SceneDebugDrawInstance=0
SceneDebugDump=0

; Status line interval in frames (0 = off).
StatsIntervalFrames=600

; ============================================================
; Texture packs
;
; Maps a texture pack ships next to a diffuse that vanilla FNV never binds.
; NVR-style packs: diffuse = albedo, _n = normal (gloss in alpha, handled by
; the runtime's rtx.fnvProtocol.normalAlphaMode), _p = height.
;
; HeightMaps: for every object whose shader has no HeightMap of its own
; (vanilla binds one only for the PAR* parallax shaders), "foo.dds" ->
; "foo_p.dds" is looked up (loose Data\Textures first, then the game's
; loaded BSAs: SArchiveList from Fallout.ini / FalloutCustom.ini, Update.bsa,
; and "<Plugin>.bsa" / "<Plugin> - *.bsa" for the plugins in plugins.txt),
; loaded in the background and handed to Remix as the draw's height map.
; Remix renders it as parallax occlusion mapping, which needs, in rtx.conf:
;   rtx.fnvProtocol.heightDisplaceIn   POM depth (default 0.05; 0 = off)
;   rtx.displacement.mode = RaymarchPOM   (QuadtreePOM, the default, expects
;                                        max-filtered height mips that game
;                                        height maps don't have)
; Near land gets every layer's height, blended by the layer weights
; ([RemixApi] TerrainHeightMaps; always the raymarch there).
; ============================================================
[TexturePacks]
HeightMaps=1
; Suffixes tried in order, comma-separated (e.g. "_p,_h").
HeightSuffixes=_p
; Height textures created per frame and the file bytes they may total (at
; least one is always created). Objects whose height map is still loading
; draw without it for those frames.
MaxLoadsPerFrame=4
MaxLoadKBPerFrame=8192
; Frames a loaded height map may go unused before it is released.
EvictFrames=3600
; Extra BSAs (relative to Data\, comma-separated) searched after the game's
; own, highest priority last, for archives the game loads some other way.
ExtraArchives=
; Log every height map found (not just the first).
LogResolves=0
; Status line interval in frames (0 = off).
StatsIntervalFrames=1800

; ============================================================
; Skinning
;
; Enabled=1: the engine hooks that capture each skinned object's bone palette
; for the Remix-API skinned path. 0 = skinned actors are not drawn. Skinned
; passes without a diffuse texture (Gamebryo's additive per-light /
; environment / rim passes) are always dropped: they only add raster
; lighting, which the path tracer replaces. Look for [Skin] lines in
; rtx-remix\logs\remix-comp.log.
; ============================================================
[Skinning]
Enabled=1

; ============================================================
; Point Lights
;
; The engine monitor plugin's light registry (fnv_remix_nvse.dll): placed
; lights while their reference is loaded, the lights in the engine's active
; lists, and the player's light, submitted via D3D9 SetLight/LightEnable.
; RTX Remix intercepts them for path tracing. Without the plugin no engine
; light is sent.
; ============================================================
[Lights]
Enabled=1
IntensityPercent=100

; Range mode:
;   0 = the light's radius as the engine stores it
;   1 = the distance at which its attenuation reaches 1/255
;   2 = unbounded; the runtime picks the range
RangeMode=0

; The Pip-Boy light is identified from the engine's own data (by the plugin):
; the NiPointLight of the LightEffect on the player's active effect list (the PipboyLightEffect
; spell the Pip-Boy button casts; any other light spell on the player takes the
; same path, as the engine gives the player one such light at most). Its colour
; and radius come from the engine; it is sent every frame while the engine holds
; it and dropped the frame the engine switches it off. The engine
; hangs it on the player's body, inside the traced player mesh, so in first
; person it is placed EffectLightForward units ahead of the eye along the view, a
; headlamp (0 = where the engine puts it). In third person (the engine's
; PlayerCharacter bThirdPerson) the eye is behind the player and a light there is
; shadowed by the body: the light stays where the engine hangs it, plus
; EffectLightThirdPersonForward units along the view's horizontal direction (out
; of the body, ahead of the player; 0 = the engine's position). [Lights] logs each
; first / third person switch. FollowerIntensityPercent multiplies its brightness.
; All apply live from Host Settings. Every other light is sent as the engine has
; it, including the radius-6 amber light that rides with the first-person arm.
EffectLightForward=1
EffectLightThirdPersonForward=20
FollowerIntensityPercent=100

; ============================================================
; Diagnostic Logging
; ============================================================
[Diagnostics]
Enabled=0
DelayMs=300000
LogFrames=3
; Log the first N distinct screen-space draws (PASS_2D, DP_PASS_2D) and small
; FFP draws (<= 8 vertices) near the camera or through the viewmodel
; projection: route, PS / VS hash, the stage-0 texture's Remix hash and which
; rtx.conf list has it, the transform summary, and what was done ([ScreenSpace]
; lines in rtx-remix\logs\remix-comp.log). Works with Enabled=0. 0 = off.
ScreenSpaceLog=0

; ============================================================
; Logging (rtx-remix\logs\remix-comp.log)
; ============================================================
[Logging]
; 1 = every line, including the dev diagnostics ([Decal], [DecalRoute],
; [Addressing], [Hair] and the [Frame] histograms at game-state changes).
; 0 = a repeated kind of line ([Module] and its first two words) is written
; for its first 10 lines (warnings and errors: 50), then at most once every
; 5 minutes with a count of the lines held back. State changes, the startup
; report and the 60-second [Session] status line are always written.
; The previous session's log is kept as remix-comp.prev.log, a crash writes the
; last 64 lines to the log, and past 20 MB only errors are written.
Verbose=0
; 1 = a console window shows the log as it is written.
Console=0

; ============================================================
; Session report (rtx-remix\logs)
; ============================================================
[SessionReport]
; session.json is always written: the mod version, the start time, the end
; state ("running", then "clean" at a normal exit), and every 10 s the play
; time, frame count and the player's cell, worldspace and position.
; 1 = each session (its logs, session.json, load order, config snapshot,
; crash log, hang dumps, renderer crash dumps, mark screenshots and Crash
; Logger logs) is zipped to
; rtx-remix\logs\archive\NewVegasRTX-<version>_<start time>.zip: when the
; game quits (if that takes at most 4 s), else by the reporter below once the
; game process has ended, else at the next start. After a crash, the problem
; notice names that zip as the file to upload. Its session.json in the zip
; says how it ended: clean, crash or hang. The unzipped logs stay where they
; are. The Remix menu's Host Settings > SessionReport > Save Report Now zips
; the session so far at any time (...-snapshot-<time>.zip).
Archive=1
; 1 = NewVegasRTX-Reporter.exe (next to d3d9.dll) starts with the game,
; waits for the game process to end however it ends (crash, fail-fast,
; Task Manager, a hang that was killed), and zips the session then. After a
; crash or hang it shows a small window with the zip's path and Show File /
; Copy Path buttons. It reads and writes rtx-remix\logs only: no network, no
; registry. 0 = such a session is zipped at the next start.
Reporter=1
; The newest zips kept in the archive folder.
ArchiveKeep=20
; 1 = the zip's text files say <user> instead of the Windows user name and
; profile folder, and dumps have the user name masked. The files in
; rtx-remix\logs are not changed.
ScrubUserName=1
; 1 = loadorder.txt (the plugins the engine loaded, in load order, the NVSE
; plugins and every DLL in the game with its version and path),
; loadorder-changes.txt (what was added, removed, moved or updated since the
; previous session) and config\ (Fallout.ini, FalloutPrefs.ini,
; FalloutCustom.ini as the game reads them, nvtf.ini, remix-comp.ini,
; rtx.conf, user.conf, dxvk.conf).
Snapshots=1
; Seconds without a frame, with the game window in front and no load
; running, before rtx-remix\logs\hang-<time>.dmp is written (at most 3 per
; session; the next one after frames come back). 0 = no hang watchdog.
HangSeconds=15
; The mark key: writes "[Mark] #N at <time>, cell <name>" to remix-comp.log
; and fnv_remix_nvse.log and saves a screenshot to
; rtx-remix\logs\screenshots\mark-<session start>-NN.png. F1-F24, a letter or
; digit, or a virtual-key code (0x77). Empty or 0 = off.
MarkKey=F8
; The folder Crash Logger copies its crash logs to, relative to the game
; folder (an absolute path works too). Logs written during the previous
; session go into its zip. Empty = none.
CrashLogFolder=Crash Logs
; 1 = when the game crashes, rtx-remix\logs\crash-<time>.txt says where:
; the exception, the call stack, the game objects (forms) found in the
; registers and on the stack with the plugins (.esm / .esp) they come from,
; the place, the load order and the loaded DLLs. Its first lines name the
; module it crashed in and the plugins involved. Crash Logger and other
; crash handlers still run after it. It goes into the session's zip.
CrashLog=1

; ============================================================
; Frame Tracer
; ============================================================
[Tracer]
BacktraceDepth=8
OutputDir=captures

; ============================================================
; Sun / Moon time-of-day passthrough
;
; Each frame, reads the engine's sun/moon scene-graph orientation
; and pushes it to Remix via rtx.atmosphere.sun*/moon0.* config vars.
; Set Enabled=0 to leave Remix's atmosphere using its own defaults.
; ============================================================
[SunCycle]
Enabled=1

[MoonCycle]
Enabled=1

; ============================================================
; Weather -> NUMOS sky presets
;
; Each frame the sky's current and outgoing weather and the engine's
; transition fraction are pushed to rtx.weather.gameWeather,
; gameWeatherOutgoing and gameWeatherBlend as "<form id>, fnv.<class>".
; The runtime shows the preset bound to the first of those ids it knows
; and follows the engine's blend; a preset you bind to a form ID (Remix
; dev menu, Sky > Weather) wins over the class. A cut with no engine
; blend (console fw) fades over the preset's transition time.
;
; The class comes from the weather record itself, so a mod's weathers
; are classed like the vanilla ones (first rule that matches):
;   rainy flag            -> Storm when thunder <= StormThunderMax, else Rain
;   snow flag             -> Snow
;   fog far <= FogFarMax     -> Dust when wind >= DustWindMin, else Fog
;   fog far <= HazeFogFarMax -> Dust when windy, Overcast when cloudy, else Haze
;   cloudy flag           -> Cloudy
;   otherwise             -> Clear
; "fog far" is the day's far fog distance (the night's when the day's is 0).
;
; Class -> preset: a file name in the preset folder without .conf (NUMOS
; writes Clear, Fair, PartlyCloudy, Cloudy, Overcast, Haze, Fog, Storm,
; Drizzle, Altostratus; add your own there). Empty = the class is unbound
; and NUMOS keeps its chosen preset / settings for it. With BindPresets=1
; the wrapper writes each class id (fnv.clear, ...) into the bindings of
; its preset at startup and removes it from the others; changes here
; apply at the next start. Look for [Weather] lines in the log.
; ============================================================
[Weather]
Enabled=1
BindPresets=1
; The runtime's rtx.weather.presetDirectory, relative to the game folder.
PresetDirectory=rtx-remix/weather
FogFarMax=20000
HazeFogFarMax=60000
DustWindMin=100
StormThunderMax=200
Clear=Fair
Haze=Haze
Cloudy=Cloudy
Overcast=Overcast
Fog=Fog
Dust=Haze
Rain=Drizzle
Storm=Storm
Snow=Overcast

; ============================================================
; Menu backgrounds
;
; FNV renders the world ONCE into a menu-background texture when a menu
; opens and pastes that frozen image behind the menu every frame, so under
; Remix the background would be blank.
;
; Pip-Boy: with LiveBackground=1 the engine's own background capture is
; re-requested every Pip-Boy frame and routed as normal world geometry, so
; the world behind the Pip-Boy is path-traced live. Costs roughly one
; gameplay frame of CPU/GPU work per Pip-Boy frame.
;
; Every other menu (containers, barter, terminals, the lockpick, the pause
; menu, ...) keeps the frozen background, filled with a picture of the last
; path-traced frame, and costs no path tracing while it is open. The mod
; sets bStaticMenuBackground to 1 in memory ([GameSettings]): terminals,
; character creation and the lockpick are only drawn on that path.
; Look for [MenuBg] lines in rtx-remix\logs\remix-comp.log.
; ============================================================
[MenuBackground]
; 1 = live path-traced world behind the Pip-Boy, 0 = the frozen picture.
LiveBackground=1
; 1 = drop the ISMENUBG sepia/darken pass behind the live Pip-Boy.
SkipTint=1
; 1 = keep the live background through the Pip-Boy's closing animation.
KeepDuringClose=1
; How the capture pass reaches the path tracer:
;   0 = route it in place (only if its target is backbuffer-sized)
;   1 = in place when backbuffer-sized, else bind the backbuffer instead
;   2 = always bind the backbuffer instead (with the gameplay depth
;       buffer when the game's own is smaller than the backbuffer)
RedirectMode=1

[PipBoy]
; Emissive intensity of the Pip-Boy screen's contents (the interface the
; engine renders offscreen and blends onto the screen mesh), 0..16 in the
; runtime's emissive-intensity units (0..4 on a runtime without
; rtx.worldSpaceUiEmissiveIntensity, which the wrapper raises to 8).
; The contents glow over the screen glass, so they stay readable in
; sunlight. 0 = the contents are not drawn. Live in Host Settings.
ScreenEmissive=6.0
; Albedo of the screen glass behind the contents, 0..1 of its texture.
; The glass is also made glossy and non-metallic: low values give dark
; CRT glass that sun and sky can't wash out behind the text; 1 = the
; game's grey. Live in Host Settings.
ScreenGlassBrightness=0
; Gloss of the screen glass, a Blinn-Phong exponent 10..1000: higher =
; sharper, more mirror-like reflections (1000 = roughness 0.21), lower =
; a softer sheen (200 = 0.32, 10 = 0.64). The screen mesh is drawn with
; smoothed normals, so the reflection runs smoothly across the curved
; glass instead of in flat bands. Live in Host Settings.
ScreenGlassGloss=10

; ============================================================
; VATS hit chance
;
; VATS scales a gun's hit chance on each limb by how much of that limb is
; visible, which the engine measures with occlusion queries over its own
; rasterised draw of the target. Under Remix the target is path-traced,
; never rasterised, so the queries count no pixels and every limb reads
; 0% with guns (melee and thrown weapons do not use it). With Enabled=1
; the visibility is estimated with the engine's own line-of-sight checks
; instead: rays from the player to the limb and to points on a small ring
; around it, visibility = the share of them that are not blocked. Partial
; cover lowers the chance, full cover makes it 0%. Look for [VATS] lines
; in rtx-remix\logs\remix-comp.log ([Logging] Verbose=1 lists every limb).
; ============================================================
[Hair]
; How light hair, beards and brows are, as a multiplier over the colour the
; game's hair shader gives them, 1..4. 1 = the shader's colour alone. The
; game's overbright lighting and hair sheen make hair lighter in game, which
; path tracing doesn't; higher values brighten it. Colours clip at white, as
; the game's lighting clips them. Live in Host Settings and the Alt+X menu
; (hair drawn from then on).
Brightness=1.0

[VATS]
; 1 = line-of-sight estimate, 0 = the engine's occlusion queries (0% under
; Remix). Live in Host Settings once the hook is installed at startup.
Enabled=1
; Radius of the ring of sample points around a limb, in game units
; (0..100; a human head is about 10 across). Whole objects such as mines
; use half their bounding radius instead. Live in Host Settings.
SampleRadius=10
; Rays per limb, 1..16: one to the limb itself, the rest spread evenly on
; the ring. VATS checks each limb once when a target is selected. Live in
; Host Settings.
SampleCount=7

; ============================================================
; Save screenshots
; ============================================================
; The game takes a save's picture by drawing the world again, which Remix
; does not show, so saves get a blank picture. With this on, a save stores
; the latest small copy of the path-traced frame instead (without the HUD
; or menus). The copy is refreshed during play while the Pip-Boy is closed.
[SaveScreenshots]
; 1 = path-traced picture, 0 = the engine's own capture (blank under Remix).
Enabled=1
; How often the copy is refreshed, in milliseconds (250..60000).
RefreshMs=1500
